[package]
name = "omarchy-tidalplayer"
version = "1.0.0"
edition = "2021"
authors = ["scorchedegg"]
description = "High-performance native TIDAL player and daemon for Omarchy"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.8", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
dirs = "6.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
parking_lot = "0.12"
zbus = { version = "5.0", features = ["tokio"] }
# Casting: mDNS discovery of Chromecast/Google TV devices. The TLS stack is
# already in the tree through zbus/reqwest, so only the client side is named
# explicitly; `ring` avoids the aws-lc-rs provider's cmake/nasm build.
mdns-sd = "0.13"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

# The player ships committed x86_64 and aarch64 binaries in bin/ because the
# plugin is installed as a git checkout with no build step. Keep the artifacts
# lean and deterministic: thin LTO + single codegen unit + stripped symbols.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

