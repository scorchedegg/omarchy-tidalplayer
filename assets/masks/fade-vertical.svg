<svg xmlns="http://www.w3.org/2000/svg" width="10" height="100" viewBox="0 0 10 100">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <!-- White is masked away and the middle keeps a 0.05 sliver: MultiEffect
           treats alpha 0 as mask-away too (see FadeEdge / multieffect.frag). -->
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.06" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="0.94" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="10" height="100" fill="url(#fade)"/>
</svg>
