<svg xmlns="http://www.w3.org/2000/svg" width="100" height="10" viewBox="0 0 100 10">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <!-- Not zero: MultiEffect's mask shader masks away alpha 0 itself
           (m1 in multieffect.frag), so the visible area keeps a sliver of
           alpha and only the ramp reaches full opacity. -->
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="0.9" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="100" height="10" fill="url(#fade)"/>
</svg>
