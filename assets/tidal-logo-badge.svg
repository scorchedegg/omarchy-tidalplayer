          <path fill="#ffffff" transform="translate(4.7295, 0.001)" d="m 0 0 l -4.729 -4.73 L -9.459 0 l 4.73 4.728 Z"/>
        </g>
        <g transform="matrix(6.2943 0 0 -6.2943 0.0014 29.7656)">
          <path fill="#ffffff" transform="translate(4.7295, 0)" d="m 0 0 l -4.729 -4.73 L -9.459 0 l 4.73 4.73 Z"/>
